main.datasource.url=jdbc:hsqldb:file:.jmix/hsqldb/mtr
main.datasource.username=sa
main.datasource.password=

legacy.datasource.url=jdbc:postgresql://localhost:5435/reestrdb
legacy.datasource.username=reestr_ro
legacy.datasource.password=reestr_ro
legacy.datasource.hikari.read-only=true
legacy.datasource.hikari.maximum-pool-size=5
legacy.datasource.hikari.connection-timeout=10000
legacy.datasource.hikari.initialization-fail-timeout=-1

main.liquibase.change-log=com/digitilius/multireestr/liquibase/changelog.xml

jmix.ui.login-view-id=mtr_LoginView
jmix.ui.main-view-id=mtr_MainView
jmix.ui.menu-config=com/digitilius/multireestr/menu.xml
jmix.ui.composite-menu=true

# For local/lesson login only. Clear both in production (see README and config/application.properties).
ui.login.defaultUsername=admin
ui.login.defaultPassword=admin

# Optional. Required to save the legacy password from the UI (or set MTR_SECRET_KEY).
# mtr.secret-key=

jmix.core.available-locales=ru,en

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=false

# Enable colors in logs
spring.output.ansi.enabled=always

# 'debug' level logs SQL generated by EclipseLink ORM
logging.level.eclipselink.logging.sql=info

# 'debug' level logs data store operations
logging.level.io.jmix.core.datastore=info

# 'debug' level logs access control constraints
logging.level.io.jmix.core.AccessLogger=debug

# 'debug' level logs all Jmix debug output
logging.level.io.jmix=info

# 'debug' or 'trace' levels help to troubleshoot security problems
logging.level.org.springframework.security=info

logging.level.org.atmosphere=warn